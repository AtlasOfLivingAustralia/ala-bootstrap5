plugins {
    id "groovy"
//    id "com.github.erdi.webdriver-binaries"
    id "war"
    id "idea"
    //id "com.bertramlabs.asset-pipeline"
    id "cloud.wondrify.asset-pipeline" version "5.0.32"
    id "org.apache.grails.gradle.grails-web"
    id "org.apache.grails.gradle.grails-gsp"
    id "application"
    id "eclipse"
    id "maven-publish"
}

group = "org.grails.plugins"

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://repo.grails.org/grails/core/" }
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

dependencies {
    developmentOnly("org.springframework.boot:spring-boot-devtools")
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.apache.grails:grails-core:${grailsVersion}"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.grails:grails-web-boot:${grailsVersion}"
    implementation "org.apache.grails:grails-logging:${grailsVersion}"
    implementation "org.apache.grails:grails-rest-transforms:${grailsVersion}"
    implementation "org.apache.grails:grails-databinding:${grailsVersion}"
    implementation "org.apache.grails.i18n:grails-i18n:${grailsVersion}"
    implementation "org.apache.grails:grails-services:${grailsVersion}"
    implementation "org.apache.grails:grails-url-mappings:${grailsVersion}"
    implementation "org.apache.grails:grails-interceptors:${grailsVersion}"
    implementation "org.apache.grails:grails-cache:${grailsVersion}"
    implementation "org.apache.grails:grails-async:${grailsVersion}"
    implementation "org.apache.grails:grails-scaffolding:${grailsVersion}"
    implementation "org.apache.grails:grails-gsp:${grailsVersion}"
    implementation 'com.github.spullara.mustache.java:compiler:0.9.10'
    console "org.apache.grails:grails-console:${grailsVersion}"
    profile "org.apache.grails.profiles:web-plugin:${grailsVersion}"

    // ── Asset Pipeline ─────────────────────────────────────────────────────
    runtimeOnly "cloud.wondrify:asset-pipeline-grails:5.0.32"
    //runtimeOnly "com.bertramlabs.plugins:asset-pipeline-grails:3.0.10"

    testRuntimeOnly "net.sourceforge.htmlunit:htmlunit:2.18"
    implementation 'au.org.ala:ala-cas-client:4.0.0-SNAPSHOT'

    testImplementation "org.apache.grails.testing:grails-testing-support-core:${grailsVersion}"
    testImplementation "org.apache.grails:grails-testing-support-web:${grailsVersion}"
    testImplementation "org.apache.grails:grails-testing-support-datamapping:${grailsVersion}"

    testImplementation "org.spockframework:spock-core:2.3-groovy-4.0"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    testImplementation "org.mockito:mockito-core"

}

application {
    mainClass.set("au.org.ala.bootstrap5.Application")
}

java {
    sourceCompatibility = JavaVersion.toVersion("17")
}

bootRun {
    ignoreExitValue true
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-noverify',
            '-XX:TieredStopAtLevel=1',
            '-Xmx1024m')
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}
// enable if you wish to package this plugin as a standalone application
bootJar.enabled = false

test {
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}
tasks.withType(Test) {
    useJUnitPlatform()
}

assets {
    packagePlugin = true
}

tasks.register("sourcesJar", Jar) {
    from sourceSets.main.allJava
    archiveClassifier = "sources"
}

tasks.register("javadocJar", Jar) {
    from javadoc
    archiveClassifier = "javadoc"
}

publishing {
    repositories {
        maven {
            name 'Nexus'
            url "https://nexus.ala.org.au/content/repositories/${project.version.endsWith('-SNAPSHOT') ? 'snapshots' : 'releases' }"
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }
    publications {
        mavenJar(MavenPublication) {
            pom.withXml {
                def pomNode = asNode()
                if (pomNode.dependencyManagement) {
                    pomNode.dependencyManagement.replaceNode {}
                }

                // simply remove dependencies without a version
                // version-less dependencies are handled with dependencyManagement
                // see https://github.com/spring-gradle-plugins/dependency-management-plugin/issues/8 for more complete solutions
                if (pomNode.dependencies?.dependency) {
                    pomNode.dependencies.dependency.findAll {
                        it.version.text().isEmpty()
                    }.each {
                        it.replaceNode {}
                    }
                }
            }
            from components.java
            artifact sourcesJar
            artifact javadocJar

        }
    }
}
